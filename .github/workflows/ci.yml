name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: pytest -q