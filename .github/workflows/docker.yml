name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - src/**
      - corpus/**
      - start.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image (rebuilds the index from arXiv)
        run: docker build -t adversarial-attacks-rag .
      - name: Smoke test (the API loads the model and the index, then the web interface answers)
        run: |
          docker run -d --name app -p 7860:7860 -e GEMINI_API_KEY=dummy adversarial-attacks-rag
          for i in $(seq 1 90); do
            if curl -sf http://localhost:7860/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish the index to the private Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker cp app:/app/data ./index
          pip install huggingface_hub==1.33.0
          hf upload AymaneGAZI/adversarial-attacks-rag-index ./index . --repo-type dataset --commit-message "Index built from ${GITHUB_SHA::7}"