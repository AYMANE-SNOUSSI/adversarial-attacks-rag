services:
  api:
    build: .
    image: adversarial-attacks-rag  # built once, reused by the app service
    command: ["uvicorn", "api:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env  # GEMINI_API_KEY, given at run time and never stored in the image
    ports:
      - "8000:8000"

  app:
    image: adversarial-attacks-rag
    pull_policy: never  # use the local image built for api, never download it
    command: ["streamlit", "run", "src/app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api